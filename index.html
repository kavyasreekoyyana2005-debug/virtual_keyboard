<!DOCTYPE html>
<html>
<head>
  <title>Virtual Keyboard</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      padding:20px;
    }
    #keyboard{
      display:flex;
      flex-wrap:wrap;
      width:400px;
      margin:auto;
      gap:10px;
      justify-content:center;
    }
    button{
      width:50px;
      height:50px;
      font-size:18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
    textarea{
      width:400px;
      height:100px;
      margin:20px;
      font-size:18px;
      padding:10px;
    }
  </style>
</head>
<body>

<h1>AI Virtual Keyboard</h1>

<textarea id="out"></textarea>

<div id="keyboard"></div>

<script>
const out=document.getElementById('out');
const kb=document.getElementById('keyboard');

const keys=[
  'Q','W','E','R','T','Y',
  'U','I','O','P','A','S',
  'D','F','G','H','J','K',
  'L','Z','X','C','V','B',
  'N','M'
];

keys.forEach(k=>{
  const b=document.createElement('button');
  b.innerText=k;
  b.onclick=()=>out.value+=k;
  kb.appendChild(b);
});

// SPACE
const space=document.createElement('button');
space.innerText='SPACE';
space.style.width='120px';
space.onclick=()=>out.value+=' ';
kb.appendChild(space);

// ENTER
const enter=document.createElement('button');
enter.innerText='ENTER';
enter.style.width='120px';
enter.onclick=()=>out.value+='\\n';
kb.appendChild(enter);

// BACKSPACE
const back=document.createElement('button');
back.innerText='⌫';
back.style.width='120px';
back.onclick=()=>{
  out.value=out.value.slice(0,-1);
};
kb.appendChild(back);
</script>

</body>
</html>
