<!DOCTYPE html>
<html>
<head>
  <title>Virtual Keyboard</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      padding:20px;
    }
    #keyboard{
      display:flex;
      flex-wrap:wrap;
      width:400px;
      margin:auto;
      gap:10px;
      justify-content:center;
    }
    button{
      width:50px;
      height:50px;
      font-size:18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
    textarea{
      width:400px;
      height:100px;
      margin:20px;
      font-size:18px;
      padding:10px;
    }
    .camera-box{
      position:relative;
      width:640px;
      margin:20px auto;
    }
    #video,#canvas{
      width:640px;
      height:480px;
      border-radius:15px;
      border:2px solid #38bdf8;
    }
    #canvas{
      position:absolute;
      left:0;
      top:0;
    }
  </style>
</head>
<body>

<h1>AI Virtual Keyboard</h1>

<textarea id="out"></textarea>
  <div class="camera-box"> 
    <video id="video" autoplay playsinline></video> 
    <canvas id="canvas"></canvas> 
  </div>

<div id="keyboard"></div>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
  </script>

<script>
const out = document.getElementById('out');
const kb = document.getElementById('keyboard');

// Keyboard layout
const layout = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];

// Create rows
layout.forEach(row => {
  const rowDiv = document.createElement('div');
  rowDiv.style.display = 'flex';
  rowDiv.style.justifyContent = 'center';
  rowDiv.style.gap = '10px';
  rowDiv.style.marginBottom = '10px';

  row.forEach(key => {
    const b = document.createElement('button');
    b.innerText = key;
    b.style.width = '50px';
    b.style.height = '50px';
    b.style.fontSize = '18px';
    b.style.border = 'none';
    b.style.borderRadius = '10px';
    b.style.background = '#2563eb';
    b.style.color = 'white';
    b.style.cursor = 'pointer';

    b.onclick = () => out.value += key;

    rowDiv.appendChild(b);
  });

  kb.appendChild(rowDiv);
});

// Last row
const lastRow = document.createElement('div');
lastRow.style.display = 'flex';
lastRow.style.justifyContent = 'center';
lastRow.style.gap = '10px';
lastRow.style.marginTop = '10px';

// SPACE
const space = document.createElement('button');
space.innerText = 'SPACE';
space.style.width = '200px';
space.style.height = '50px';
space.style.fontSize = '16px';
space.style.border = 'none';
space.style.borderRadius = '10px';
space.style.background = '#2563eb';
space.style.color = 'white';
space.style.cursor = 'pointer';
space.onclick = () => out.value += ' ';
lastRow.appendChild(space);

// ENTER
const enter = document.createElement('button');
enter.innerText = 'ENTER';
enter.style.width = '100px';
enter.style.height = '50px';
enter.style.fontSize = '16px';
enter.style.border = 'none';
enter.style.borderRadius = '10px';
enter.style.background = '#2563eb';
enter.style.color = 'white';
enter.style.cursor = 'pointer';
enter.onclick = () => out.value += '\\n';
lastRow.appendChild(enter);

// BACKSPACE
const back = document.createElement('button');
back.innerText = '⌫';
back.style.width = '80px';
back.style.height = '50px';
back.style.fontSize = '20px';
back.style.border = 'none';
back.style.borderRadius = '10px';
back.style.background = '#dc2626';
back.style.color = 'white';
back.style.cursor = 'pointer';
back.onclick = () => {
  out.value = out.value.slice(0, -1);
};
lastRow.appendChild(back);

kb.appendChild(lastRow);
  // Camera + Hand Tracking
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Open webcam
navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
  video.srcObject = stream;
});

// MediaPipe Hands
const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

// Draw finger
hands.onResults((results) => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {
      const index = landmarks[8];

      const x = index.x * canvas.width;
      const y = index.y * canvas.height;

      ctx.beginPath();
      ctx.arc(x, y, 10, 0, 2 * Math.PI);
      ctx.fillStyle = 'lime';
      ctx.fill();
    }
  }
});

// Start camera
const camera = new Camera(video, {
  onFrame: async () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});

camera.start();
</script>

</body>
</html>
