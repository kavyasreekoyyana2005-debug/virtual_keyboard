<!DOCTYPE html>
<html>
<head>
  <title>Virtual Keyboard</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      padding:20px;
    }
    #keyboard{
      display:flex;
      flex-wrap:wrap;
      width:400px;
      margin:auto;
      gap:10px;
      justify-content:center;
    }
    button{
      width:50px;
      height:50px;
      font-size:18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
    textarea{
      width:400px;
      height:100px;
      margin:20px;
      font-size:18px;
      padding:10px;
    }
    .camera-box{
      position:relative;
      width:640px;
      margin:20px auto;
    }
    #video,#canvas{
      width:640px;
      height:480px;
      border-radius:15px;
      border:2px solid #38bdf8;
    }
    #canvas{
      position:absolute;
      left:0;
      top:0;
    }
  </style>
</head>
<body>

<h1>AI Virtual Keyboard</h1>

<textarea id="out"></textarea>
  <div class="camera-box"> 
    <video id="video" autoplay playsinline></video> 
    <canvas id="canvas"></canvas> 
  </div>

<div id="keyboard"></div>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
  </script>
  <script>

const out = document.getElementById('out');
const kb = document.getElementById('keyboard');

// Create virtual keyboard
const layout = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];

let keyElements = [];

layout.forEach(row => {
  const rowDiv = document.createElement('div');
  rowDiv.style.display = 'flex';
  rowDiv.style.justifyContent = 'center';
  rowDiv.style.gap = '10px';
  rowDiv.style.marginBottom = '10px';

  row.forEach(key => {
    const b = document.createElement('button');
    b.innerText = key;
    b.className = 'vk-key';
    b.style.width = '50px';
    b.style.height = '50px';
    b.style.fontSize = '18px';
    b.style.border = 'none';
    b.style.borderRadius = '10px';
    b.style.background = '#2563eb';
    b.style.color = 'white';

    rowDiv.appendChild(b);
    keyElements.push({key, el:b});
  });

  kb.appendChild(rowDiv);
});

// Space row
const row = document.createElement('div');
row.style.display='flex';
row.style.justifyContent='center';
row.style.gap='10px';

const space=document.createElement('button');
space.innerText='SPACE';
space.style.width='220px';
space.style.height='50px';
space.style.border='none';
space.style.borderRadius='10px';
space.style.background='#2563eb';
space.style.color='white';
row.appendChild(space);

const back=document.createElement('button');
back.innerText='⌫';
back.style.width='80px';
back.style.height='50px';
back.style.border='none';
back.style.borderRadius='10px';
back.style.background='#dc2626';
back.style.color='white';
row.appendChild(back);

kb.appendChild(row);

keyElements.push({key:'SPACE',el:space});
keyElements.push({key:'BACK',el:back});

// Camera
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{
  video.srcObject=stream;
});

// MediaPipe
const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});

let lastPress = 0;
let hovered = null;

hands.onResults(results => {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  hovered = null;
  keyElements.forEach(k => k.el.style.background = k.key==='BACK' ? '#dc2626' : '#2563eb');

  if(results.multiHandLandmarks){
    const lm = results.multiHandLandmarks[0];

    const ix = lm[8].x * canvas.width;
    const iy = lm[8].y * canvas.height;

    const tx = lm[4].x * canvas.width;
    const ty = lm[4].y * canvas.height;

    const dist = Math.hypot(ix-tx, iy-ty);

    // Draw finger
    ctx.beginPath();
    ctx.arc(ix,iy,10,0,Math.PI*2);
    ctx.fillStyle='lime';
    ctx.fill();

    // Map finger to keyboard
    const videoRect = video.getBoundingClientRect();
    const pageX = videoRect.left + (ix / canvas.width) * videoRect.width;
    const pageY = videoRect.top + (iy / canvas.height) * videoRect.height;

    keyElements.forEach(k => {
      const r = k.el.getBoundingClientRect();

      if(pageX > r.left && pageX < r.right &&
         pageY > r.top && pageY < r.bottom){

        hovered = k;
        k.el.style.background = '#22c55e';
      }
    });

    // Pinch to type
    if(dist < 35 && hovered && Date.now()-lastPress > 500){

      if(hovered.key === 'SPACE'){
        out.value += ' ';
      } else if(hovered.key === 'BACK'){
        out.value = out.value.slice(0,-1);
      } else {
        out.value += hovered.key;
      }

      hovered.el.style.background = '#16a34a';
      lastPress = Date.now();
    }
  }
});

// Start camera
const camera = new Camera(video,{
  onFrame: async () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    await hands.send({image:video});
  },
  width:640,
  height:480
});

camera.start();
    </script>

</body>
</html>
