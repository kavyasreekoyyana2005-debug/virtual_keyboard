<!DOCTYPE html>
<html>
<head>
  <title>Virtual Keyboard</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      padding:20px;
    }
    #keyboard{
      display:flex;
      flex-wrap:wrap;
      width:400px;
      margin:auto;
      gap:10px;
      justify-content:center;
    }
    button{
      width:50px;
      height:50px;
      font-size:18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
    textarea{
      width:400px;
      height:100px;
      margin:20px;
      font-size:18px;
      padding:10px;
    }
  </style>
</head>
<body>

<h1>AI Virtual Keyboard</h1>

<textarea id="out"></textarea>

<div id="keyboard"></div>

<script>
const out=document.getElementById('out');
const kb=document.getElementById('keyboard');

'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').forEach(k=>{
  const b=document.createElement('button');
  b.innerText=k;
  b.onclick=()=>out.value+=k;
  kb.appendChild(b);
});
</script>

</body>
</html>
